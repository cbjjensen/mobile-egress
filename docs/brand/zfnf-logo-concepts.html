<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZFNF Logo Concepts</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      body {
        margin: 0;
        background: #000;
        color: #f2f5fb;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 24px;
        box-sizing: border-box;
      }

      img {
        width: min(100%, 1440px);
        height: auto;
        border: 1px solid rgba(232, 240, 255, 0.12);
        border-radius: 12px;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="./zfnf-logo-concepts.svg" alt="ZFNF logo concept sheet">
    </main>
  </body>
</html>
