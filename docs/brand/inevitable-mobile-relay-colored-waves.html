<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inevitable Mobile Relay — Colored radio waves</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif}main{max-width:1760px;margin:auto;padding:28px 32px}header{margin-bottom:24px}.eyebrow{color:#7ef2c5;font-size:12px;font-weight:700;letter-spacing:2px;margin:0 0 10px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}p{color:#a9b0bd;font-size:14px;margin:0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#000;color:inherit;border:1px solid #303641;border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit}.card:hover,.card:focus-visible{border-color:#7ef2c5;outline:2px solid #7ef2c5;outline-offset:3px}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.card span{display:block;min-height:55px;padding:16px;font-size:17px;background:#101319}.card b{color:#7ef2c5;margin-right:10px}footer{font-size:12px;color:#8e97a7;margin-top:18px}a{color:#7ef2c5}dialog{border:1px solid #343946;border-radius:18px;background:#000;color:#fff;padding:18px;max-width:min(90vw,880px);max-height:94vh}dialog::backdrop{background:#000c}dialog img{display:block;max-width:100%;max-height:76vh;object-fit:contain;margin:auto}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:24px}.close{background:#1b2028;border:1px solid #39404f;color:#fff;padding:12px 18px;border-radius:8px;cursor:pointer}h2{font-size:20px;margin:0}dialog p{margin:12px 0 0}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:540px){main{padding:20px 12px}.grid{gap:10px}h1{font-size:24px}.card span{padding:12px;font-size:14px}}
</style></head><body><main><header><p class="eyebrow">INEVITABLE MOBILE RELAY</p><h1>The color becomes the signal.</h1><p>Four variations of Broadcast — stone colors in the radio waves, with the gems removed. Select a logo to enlarge.</p></header><section class="grid" aria-label="Four colored-wave logo variations"><button class="card" data-src="../../assets/branding/colored-waves-2026-10-06/w1-solid-bands.png" data-title="W1 — Solid bands"><img src="../../assets/branding/colored-waves-2026-10-06/w1-solid-bands.png" alt="W1: Solid bands, radio waves using the six stone colors with no gems"><span><b>W1</b> Solid bands</span></button>
<button class="card" data-src="../../assets/branding/colored-waves-2026-10-06/w2-segmented-waves.png" data-title="W2 — Segmented waves"><img src="../../assets/branding/colored-waves-2026-10-06/w2-segmented-waves.png" alt="W2: Segmented waves, radio waves using the six stone colors with no gems"><span><b>W2</b> Segmented waves</span></button>
<button class="card" data-src="../../assets/branding/colored-waves-2026-10-06/w3-gradient-waves.png" data-title="W3 — Gradient waves"><img src="../../assets/branding/colored-waves-2026-10-06/w3-gradient-waves.png" alt="W3: Gradient waves, radio waves using the six stone colors with no gems"><span><b>W3</b> Gradient waves</span></button>
<button class="card" data-src="../../assets/branding/colored-waves-2026-10-06/w4-angular-waves.png" data-title="W4 — Angular waves"><img src="../../assets/branding/colored-waves-2026-10-06/w4-angular-waves.png" alt="W4: Angular waves, radio waves using the six stone colors with no gems"><span><b>W4</b> Angular waves</span></button></section><footer>Visual exploration · <a href="inevitable-mobile-relay-colored-waves.md">Design notes and prompts</a></footer></main><dialog id="viewer" aria-labelledby="viewer-title"><div class="dialog-top"><h2 id="viewer-title"></h2><button class="close" type="button">Close</button></div><img id="viewer-image" alt=""><p><a id="original" href="">Open full-resolution PNG</a></p></dialog><script>const viewer=document.getElementById('viewer');document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{document.getElementById('viewer-title').textContent=card.dataset.title;const img=document.getElementById('viewer-image');img.src=card.dataset.src;img.alt=card.dataset.title;document.getElementById('original').href=card.dataset.src;viewer.showModal()}));document.querySelector('.close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});</script></body></html>
