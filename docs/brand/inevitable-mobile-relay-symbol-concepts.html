<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inevitable Mobile Relay — 10 logo concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0d;color:#f3f5f7;font-family:Inter,Segoe UI,Arial,sans-serif}main{max-width:1700px;margin:auto;padding:32px 36px}header{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:25px}h1{font-size:28px;letter-spacing:-.7px;margin:0 0 8px}.eyebrow{color:#7ef2c5;font-size:12px;font-weight:700;letter-spacing:2px;margin:0 0 10px}p{color:#a9b0bd;margin:0;font-size:14px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.card{background:#000;color:inherit;border:1px solid #272b35;border-radius:14px;padding:0;overflow:hidden;cursor:pointer;text-align:left;font:inherit}.card:hover,.card:focus-visible{border-color:#7ef2c5;outline:2px solid #7ef2c5;outline-offset:3px}.card img{display:block;width:100%;aspect-ratio:1;object-fit:contain}.card span{display:block;padding:14px 16px 16px;background:#101319;font-size:16px}.card b{color:#7ef2c5;margin-right:9px;font-variant-numeric:tabular-nums}footer{color:#8e97a7;font-size:12px;margin-top:20px}dialog{border:1px solid #343946;border-radius:18px;background:#000;color:#fff;padding:18px;max-width:min(90vw,880px);max-height:94vh}dialog::backdrop{background:#000c}dialog img{display:block;max-width:100%;max-height:76vh;object-fit:contain;margin:auto}.dialog-top{display:flex;justify-content:space-between;align-items:center;gap:24px}.close{background:#1b2028;border:1px solid #39404f;color:#fff;padding:12px 18px;border-radius:8px;cursor:pointer}h2{font-size:20px;margin:0}a{color:#7ef2c5}dialog p{margin:12px 0 0}@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}header{display:block}header>p{margin-top:12px}}@media(max-width:560px){main{padding:24px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}h1{font-size:24px}.card span{padding:12px;font-size:14px}}
</style></head><body><main>
<header><div><p class="eyebrow">INEVITABLE MOBILE RELAY</p><h1>10 symbols. The same six stones.</h1><p>Select a concept to view it larger.</p></div><p>Logo exploration · October 6, 2026</p></header>
<section class="grid" aria-label="Logo concepts"><button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/01-cellular.png" data-title="1. Cellular"><img src="../../assets/branding/symbol-concepts-2026-10-06/01-cellular.png" alt="Cellular symbol with six colored stones"><span><b>01</b> Cellular</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/02-exchange.png" data-title="2. Exchange"><img src="../../assets/branding/symbol-concepts-2026-10-06/02-exchange.png" alt="Exchange symbol with six colored stones"><span><b>02</b> Exchange</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/03-linked.png" data-title="3. Linked"><img src="../../assets/branding/symbol-concepts-2026-10-06/03-linked.png" alt="Linked symbol with six colored stones"><span><b>03</b> Linked</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/04-broadcast.png" data-title="4. Broadcast"><img src="../../assets/branding/symbol-concepts-2026-10-06/04-broadcast.png" alt="Broadcast symbol with six colored stones"><span><b>04</b> Broadcast</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/05-spark.png" data-title="5. Spark"><img src="../../assets/branding/symbol-concepts-2026-10-06/05-spark.png" alt="Spark symbol with six colored stones"><span><b>05</b> Spark</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/06-bridge.png" data-title="6. Bridge"><img src="../../assets/branding/symbol-concepts-2026-10-06/06-bridge.png" alt="Bridge symbol with six colored stones"><span><b>06</b> Bridge</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/07-handoff.png" data-title="7. Handoff"><img src="../../assets/branding/symbol-concepts-2026-10-06/07-handoff.png" alt="Handoff symbol with six colored stones"><span><b>07</b> Handoff</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/08-pulse.png" data-title="8. Pulse"><img src="../../assets/branding/symbol-concepts-2026-10-06/08-pulse.png" alt="Pulse symbol with six colored stones"><span><b>08</b> Pulse</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/09-portal.png" data-title="9. Portal"><img src="../../assets/branding/symbol-concepts-2026-10-06/09-portal.png" alt="Portal symbol with six colored stones"><span><b>09</b> Portal</span></button>
<button class="card" type="button" data-src="../../assets/branding/symbol-concepts-2026-10-06/10-globe.png" data-title="10. Globe"><img src="../../assets/branding/symbol-concepts-2026-10-06/10-globe.png" alt="Globe symbol with six colored stones"><span><b>10</b> Globe</span></button></section>
<footer>Visual concepts only. Current app icons are unchanged. <a href="inevitable-mobile-relay-symbol-concepts.md">Design notes and prompts</a></footer>
</main><dialog id="viewer" aria-labelledby="viewer-title"><div class="dialog-top"><h2 id="viewer-title"></h2><button class="close" type="button">Close</button></div><img id="viewer-image" alt=""><p><a id="original" href="">Open full-resolution PNG</a></p></dialog>
<script>const viewer=document.getElementById('viewer');document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{document.getElementById('viewer-title').textContent=card.dataset.title;const img=document.getElementById('viewer-image');img.src=card.dataset.src;img.alt=card.dataset.title+' logo concept';document.getElementById('original').href=card.dataset.src;viewer.showModal()}));document.querySelector('.close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});</script>
</body></html>
